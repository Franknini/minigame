      var highNotes = [chord.notes[1] * 2, chord.notes[2] * 2];
      var hlDur = (phase.chordMode === '2bar') ? beat * 8 : beat * 4;
      playHighLead(highNotes, barStart, hlDur, phase.highLead);
    }
    if (phase.shimmer > 0.01){
      var shimmerNotes = [chord.notes[0]*4, chord.notes[1]*4, chord.notes[2]*4];
      var sDur = (phase.chordMode === '2bar') ? beat * 8 : beat * 4;
      playShimmer(shimmerNotes, barStart, sDur, phase.shimmer);
    }
    if (phase.bell > 0.01){
      playBell(chord.notes[0] * 3, barStart, phase.bell);
      playBell(chord.notes[2] * 3, barStart + beat * 2, phase.bell * 0.85);
      if (barInPhase % 2 === 1) playBell(chord.notes[1] * 3, barStart + beat * 3.5, phase.bell * 0.7);
    }
    if (phase.drumMode === 'none'){}
    else if (phase.drumMode === 'buildup') drumBuildUp(barStart, beat, phase, barInPhase);
    else if (phase.drumMode === '16th-varied') drum16Varied(barStart, beat, phase, barInPhase);
    else drum8(barStart, beat, phase);

    masterLP.frequency.cancelScheduledValues(barStart);
    masterLP.frequency.setValueAtTime(masterLP.frequency.value, barStart);
    masterLP.frequency.linearRampToValueAtTime(phase.lp, barStart + beat * 2);
  }

  var phaseIndex = 0;
  var barInPhase = 0;
  var barCount = 0;
  var nextBarTime = mctx.currentTime + 0.2;
  var lookahead = 0.8;

  function getChordIdx(){
    var phase = phases[phaseIndex];
    if (phase.chordMode === '2bar') return Math.floor(barCount / 2) % 4;
    return barCount % 4;
  }

  function scheduler(){
    if (!musicPlaying) return;
    while (nextBarTime < mctx.currentTime + lookahead){
      var phase = phases[phaseIndex];
      var beat = 60 / phase.bpm;
      var barDur = beat * 4;
      if (barInPhase === 0 && phase.riserBars){
        var riserDur = barDur * phase.riserBars;
        playRiser4Layer(nextBarTime, riserDur, 1.2);
      }
      scheduleBar(nextBarTime, getChordIdx(), phase, barInPhase % 4, barInPhase, beat);
      nextBarTime += barDur;
      barCount++;
      barInPhase++;
      if (barInPhase >= phase.bars){
        if (phase.tailBeats && phase.tailBeats > 0){
          var tailStart = nextBarTime;
          var tailDur = beat * (phase.tailBeats - 0.5);
          playCrash(tailStart + tailDur, 1.2);
          nextBarTime += tailDur;
        }
        phaseIndex = nextPhaseIndex(phaseIndex);
        barInPhase = 0;
      }
    }
    setTimeout(scheduler, 120);
  }
  scheduler();
}

// ★ 立即切斷背景音樂：把 musicGain 斷開並歸零
function stopMusic(){
  musicPlaying = false;
  if (musicGain){
    try {
      musicGain.gain.cancelScheduledValues(audioCtx.currentTime);
      musicGain.gain.setValueAtTime(0, audioCtx.currentTime);
      musicGain.disconnect();
    } catch(e){}
    musicGain = null;
  }
}

/* ===================== 存檔系統 ===================== */
var activeSlot = 1;
var SLOT_KEYS = ['yinian_slot_1', 'yinian_slot_2', 'yinian_slot_3'];

try {
  var savedActiveSlot = parseInt(localStorage.getItem('yinian_active_slot') || '1', 10);
  if (savedActiveSlot >= 1 && savedActiveSlot <= 3) activeSlot = savedActiveSlot;
} catch(e){}

function loadSlot(slotNum) {
  try {
    var data = localStorage.getItem(SLOT_KEYS[slotNum - 1]);
    if (!data) return false;
    var parsed = JSON.parse(data);
    for (var k in DEFAULT_CONFIG) {
      if (parsed.hasOwnProperty(k)) CONFIG[k] = parsed[k];
    }
    return true;
  } catch(e){ return false; }
}

function saveToSlot(slotNum) {
  try {
    var data = {};
    for (var k in DEFAULT_CONFIG) {
      if (CONFIG.hasOwnProperty(k)) data[k] = CONFIG[k];
    }
    localStorage.setItem(SLOT_KEYS[slotNum - 1], JSON.stringify(data));
    return true;
  } catch(e){ return false; }
}

function setActiveSlot(slotNum) {
  activeSlot = slotNum;
  try { localStorage.setItem('yinian_active_slot', String(slotNum)); } catch(e){}

  if (!loadSlot(slotNum)) {
    // 該槽為空 → 載入預設值
    for (var k in DEFAULT_CONFIG) CONFIG[k] = DEFAULT_CONFIG[k];
  }

  updateSlotButtonsUI();

  if (typeof settingsPanel !== 'undefined' && settingsPanel.classList.contains('show')) {
    buildSettingsUI();
  }
  updateAudioVolumes();
}

function updateSlotButtonsUI() {
  var btns = document.querySelectorAll('.save-slot');
  for (var i = 0; i < btns.length; i++) {
    var n = parseInt(btns[i].dataset.slot, 10);
    if (n === activeSlot) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
    'background:rgba(94,241,255,0.95);color:#000;padding:14px 26px;border-radius:10px;' +
    'font-weight:bold;font-size:16px;z-index:99999;pointer-events:none;' +
    'box-shadow:0 0 30px rgba(94,241,255,0.7);transition:opacity 0.3s;';
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 350);
  }, 900);
}

// 綁定存檔槽按鈕
(function bindSlotButtons(){
  var btns = document.querySelectorAll('.save-slot');
  for (var i = 0; i < btns.length; i++){
    btns[i].addEventListener('click', function(e){
      if (e && e.cancelable) e.preventDefault();
      var n = parseInt(this.dataset.slot, 10);
      if (n === activeSlot) return;
      setActiveSlot(n);
      showToast('已切換到 儲存' + ['一','二','三'][n - 1]);
    });
  }
})();

// 綁定儲存按鈕
document.getElementById('saveSettingsBtn').addEventListener('click', function(){
  if (saveToSlot(activeSlot)) {
    showToast('已儲存到 儲存' + ['一','二','三'][activeSlot - 1]);
  } else {
    showToast('儲存失敗');
  }
});
/* ===================== 設定面板 UI ===================== */
var settingsPanel = document.getElementById('settingsPanel');
var openBtn = document.getElementById('openSettingsBtn');
var closeBtn = document.getElementById('closeSettingsBtn');
var resetBtn = document.getElementById('resetSettingsBtn');
var slidersContainer = document.getElementById('slidersContainer');

var sliderDefs = [
  { section: '玩家' },
  { key: 'jumpImpulse', label: '彈跳力度', min: 0, max: 800, step: 10 },
  { key: 'jumpCooldown', label: '彈跳冷卻 (秒)', min: 0, max: 1.5, step: 0.05 },
  { key: 'initialObstacles', label: '初始障礙物數量', min: 0, max: 10, step: 1 },
  { key: 'obstacleSpawnInterval', label: '新障礙物頻率 (秒)', min: 0, max: 6, step: 0.1 },
  { key: 'orbSpeed', label: '交換光球速度', min: 100, max: 1200, step: 20 },
  { key: 'maxHearts', label: '愛心畫面生成上限', min: 0, max: 5, step: 1 },
  { key: 'heartSpawnInterval', label: '愛心生成頻率 (秒)', min: 1, max: 20, step: 0.5 },
  { key: 'orbCanEatHearts', label: '交換光球可以吃愛心', type: 'checkbox' },
  { section: '重力場' },
  { key: 'gravTop', label: '上邊重力場強度', min: 0, max: 600, step: 10 },
  { key: 'gravBottom', label: '下邊重力場強度', min: 0, max: 600, step: 10 },
  { key: 'gravLeft', label: '左邊重力場強度', min: 0, max: 600, step: 10 },
  { key: 'gravRight', label: '右邊重力場強度', min: 0, max: 600, step: 10 },
  { key: 'gravityZeroPass', label: '引力是 0 時穿透', type: 'checkbox', dependsOnGravityZero: true },
  { key: 'bulletMaxDistance', label: '子彈行徑距離', min: 200, max: 5000, step: 100, dependsOn: 'gravityZeroPass', specialMax: true },
  { section: '攻擊' },
  { key: 'normalBulletSpeed', label: '普通子彈速度', min: 80, max: 800, step: 10 },
  { key: 'normalBulletInterval', label: '普通子彈生成頻率 (秒)', min: 0, max: 5, step: 0.1 },
  { key: 'sniperBulletSpeed', label: '狙擊子彈速度', min: 200, max: 1200, step: 20 },
  { key: 'sniperBulletInterval', label: '狙擊生成頻率 (秒)', min: 0, max: 6, step: 0.1 },
  { key: 'bombSpeed', label: '炸彈拋進來時速度', min: 80, max: 800, step: 10 },
  { key: 'bombInterval', label: '炸彈生成頻率 (秒)', min: 0, max: 10, step: 0.2 },
  { key: 'bombFuse', label: '炸彈出場到爆炸間隔 (秒)', min: 0.5, max: 5, step: 0.1 },
  { key: 'lightningSpeed', label: '雷電速度', min: 10, max: 300, step: 5 },
  { key: 'lightningInterval', label: '雷電生成頻率 (秒)', min: 0, max: 20, step: 0.5 },
  { section: '音效設定' },
  { key: 'musicVolume', label: '背景音效', min: 0, max: 100, step: 1 },
  { key: 'sfxVolume', label: '互動音效', min: 0, max: 100, step: 1 }
];

function buildSettingsUI(){
  slidersContainer.innerHTML = '';
  sliderDefs.forEach(function(def){
    if (def.section){
      var h3 = document.createElement('h3');
      h3.textContent = def.section;
      slidersContainer.appendChild(h3);
      return;
    }
    var row = document.createElement('div');
    row.className = 'setting-row';
    if (def.dependsOn){
      row.dataset.dependsOn = def.dependsOn;
      if (!CONFIG[def.dependsOn]) row.classList.add('disabled');
    }
    if (def.dependsOnGravityZero){
      row.dataset.dependsOnGravityZero = '1';
    }
    var label = document.createElement('label');
    label.textContent = def.label;
    row.appendChild(label);

    if (def.type === 'checkbox'){
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = CONFIG[def.key];
      cb.dataset.key = def.key;
      cb.addEventListener('change', function(){
        CONFIG[def.key] = cb.checked;
        saveConfig();
        refreshDepends();
      });
      row.appendChild(cb);
    } else {
      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = def.min;
      slider.max = def.max;
      slider.step = def.step;
      slider.value = CONFIG[def.key];
      if (def.dependsOn){
        slider.disabled = !CONFIG[def.dependsOn];
      }
      var val = document.createElement('span');
      val.className = 'val';
      val.textContent = (def.specialMax && CONFIG[def.key] >= def.max) ? '無限' : CONFIG[def.key];
      slider.addEventListener('input', function(){
        CONFIG[def.key] = parseFloat(slider.value);
        val.textContent = (def.specialMax && CONFIG[def.key] >= def.max) ? '無限' : CONFIG[def.key];
        saveConfig();
        if (def.key === 'musicVolume' || def.key === 'sfxVolume') updateAudioVolumes();
        // ★ 重力場拉桿變動時，重新檢查「引力是 0 時穿透」的可調狀態
        if (def.key.indexOf('grav') === 0) refreshDepends();
      });
      row.appendChild(slider);
      row.appendChild(val);
    }
    slidersContainer.appendChild(row);
  });
  refreshDepends();
}

function refreshDepends(){
  var rows = slidersContainer.querySelectorAll('.setting-row');
  rows.forEach(function(r){
    // 處理 gravityZeroPass 的特殊依賴：任一邊重力為 0 才能操作
    if (r.dataset.dependsOnGravityZero === '1'){
      var anyZero = hasAnyZeroGravity();
      var cb = r.querySelector('input[type=checkbox]');
      if (anyZero){
        r.classList.remove('disabled');
        if (cb) cb.disabled = false;
      } else {
        r.classList.add('disabled');
        if (cb){
          cb.disabled = true;
          // 強制取消勾選
          if (cb.checked){
            cb.checked = false;
            CONFIG.gravityZeroPass = false;
            saveConfig();
          }
        }
      }
      return;
    }
    // 處理一般的 dependsOn（例如 bulletMaxDistance 依賴 gravityZeroPass）
    var dep = r.dataset.dependsOn;
    if (!dep) return;
    var on = CONFIG[dep];
    if (on){
      r.classList.remove('disabled');
      var inp = r.querySelector('input[type=range]');
      if (inp) inp.disabled = false;
    } else {
      r.classList.add('disabled');
      var inp2 = r.querySelector('input[type=range]');
      if (inp2) inp2.disabled = true;
    }
  });
}

buildSettingsUI();

openBtn.addEventListener('click', function(){
  settingsPanel.classList.add('show');
  openBtn.style.display = 'none';
});
closeBtn.addEventListener('click', function(){
  settingsPanel.classList.remove('show');
});
resetBtn.addEventListener('click', function(){
  for (var k in DEFAULT_CONFIG) CONFIG[k] = DEFAULT_CONFIG[k];
  saveConfig();
  updateAudioVolumes();
  buildSettingsUI();
});

/* ===================== 暫停選單 ===================== */
var pauseBtn = document.getElementById('pauseBtn');
var pauseMenu = document.getElementById('pauseMenu');
var resumeBtn = document.getElementById('resumeBtn');
var quitBtn = document.getElementById('quitBtn');
var pauseMusicVol = document.getElementById('pauseMusicVol');
var pauseSfxVol = document.getElementById('pauseSfxVol');
var pauseMusicVal = document.getElementById('pauseMusicVal');
var pauseSfxVal = document.getElementById('pauseSfxVal');

function syncPauseSliders(){
  pauseMusicVol.value = CONFIG.musicVolume;
  pauseSfxVol.value = CONFIG.sfxVolume;
  pauseMusicVal.textContent = CONFIG.musicVolume;
  pauseSfxVal.textContent = CONFIG.sfxVolume;
}
pauseMusicVol.addEventListener('input', function(){
  CONFIG.musicVolume = parseInt(pauseMusicVol.value);
  pauseMusicVal.textContent = CONFIG.musicVolume;
  updateAudioVolumes();
  saveConfig();
});
pauseSfxVol.addEventListener('input', function(){
  CONFIG.sfxVolume = parseInt(pauseSfxVol.value);
  pauseSfxVal.textContent = CONFIG.sfxVolume;
  updateAudioVolumes();
  saveConfig();
});

pauseBtn.addEventListener('click', function(){
  if (state !== 'playing') return;
  state = 'paused';
  syncPauseSliders();
  pauseMenu.classList.add('show');
  pauseBtn.style.display = 'none';
  if (audioCtx && audioCtx.state === 'running'){
    audioCtx.suspend();
  }
});
resumeBtn.addEventListener('click', function(){
  state = 'playing';
  pauseMenu.classList.remove('show');
  pauseBtn.style.display = 'block';
  if (audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
});
quitBtn.addEventListener('click', function(){
  pauseMenu.classList.remove('show');
  pauseBtn.style.display = 'none';
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  state = 'playing';
  die();
});

/* ===================== 主迴圈 ===================== */
var last = performance.now();
function loop(now){
  var dt = (now - last) / 1000;
  last = now;
  try { update(dt); } catch(e){}
  try { draw(); } catch(e){}
  updateUIState();
  requestAnimationFrame(loop);
}

function updateUIState(){
  // 設定按鈕：只在 ready / dead 顯示
  if (state === 'ready' || state === 'dead'){
    if (!settingsPanel.classList.contains('show')) openBtn.style.display = 'block';
  } else {
    openBtn.style.display = 'none';
  }

  // 暫停按鈕：只在 playing 顯示
  if (state === 'playing'){
    pauseBtn.style.display = 'block';
  } else {
    pauseBtn.style.display = 'none';
  }

 // 啟動時載入當前存檔槽
loadSlot(activeSlot);
updateSlotButtonsUI();
 
reset();
state = 'ready';
requestAnimationFrame(loop);

})();
</script>
