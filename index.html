<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>意念之間</title>
<style>
   /* 存檔槽按鈕 */
   #saveSlots {
    display: flex;
    gap: 6px;
    flex: 1;
    justify-content: flex-end
  }
  .save-slot {
    background: rgba(20,30,60,0.7);
    color: rgba(150,180,220,0.5);
    border: 1px solid rgba(100,140,200,0.3);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;

  }
  .save-slot.active {
    background: rgba(94,241,255,0.25);
    color: #5ef1ff;
    border-color: #5ef1ff;
    box-shadow: 0 0 12px rgba(94,241,255,0.6);
    text-shadow: 0 0 8px rgba(94,241,255,0.9);
  }
 
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  #settingsPanel{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(5,6,20,0.94); z-index:9999; display:none;
    overflow-y:auto; padding:20px; color:#eaf6ff;

  }
  #settingsPanel.show{ display:block; }
    #settingsPanel h2{ text-align:left; margin:0; font-size:22px; flex:0 0 auto; }
  .settings-header{
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  #settingsPanel h3{ margin:18px 0 10px; font-size:15px; color:#5ef1ff;
    border-bottom:1px solid rgba(94,241,255,0.25); padding-bottom:6px; }
  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .setting-row label{ font-size:13px; flex:0 0 48%; }
  .setting-row input[type=range]{ flex:1; margin:0 8px; }

    display:flex; gap:10px; margin-top:22px; justify-content:center;

  #settingsPanel button{

<body>
<canvas id="c"></canvas>

<button id="openSettingsBtn">⚙ 設定</button>
<button id="pauseBtn">⏸</button>

<div id="settingsPanel">
  <div class="settings-header">
    <h2>⚙ 遊戲設定</h2>
    <div id="saveSlots">
      <button class="save-slot" data-slot="1">儲存一</button>
      <button class="save-slot" data-slot="2">儲存二</button>
      <button class="save-slot" data-slot="3">儲存三</button>
    </div>
  </div>
  <div id="slidersContainer"></div>
  <div class="btn-row">
    <button id="closeSettingsBtn">關閉</button>
    <button id="resetSettingsBtn" class="reset">恢復預設</button>
    <button id="saveSettingsBtn" class="save">儲存</button>
  </div>
</div>

<div id="pauseMenu">
  <div class="box">
    <h2>⏸ 暫停</h2>
    <div class="row">
      <label>背景音效</label>
      <input type="range" id="pauseMusicVol" min="0" max="100" step="1">
      <span class="val" id="pauseMusicVal">60</span>
    </div>
    <div class="row">
      <label>互動音效</label>
      <input type="range" id="pauseSfxVol" min="0" max="100" step="1">
      <span class="val" id="pauseSfxVal">100</span>
    </div>
    <button id="resumeBtn">繼續遊戲</button>
    <button id="quitBtn" class="quit">退出遊戲</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================== 設定 ===================== */
var DEFAULT_CONFIG = {
  jumpImpulse: 420,
  jumpCooldown: 0.35,
  initialObstacles: 3,
  obstacleSpawnInterval: 2.6,
  orbSpeed: 520,
  orbCanEatHearts: true,
  maxHearts: 1,
  heartSpawnInterval: 8.0,
  gravTop: 260,
  gravBottom: 260,
  gravLeft: 260,
  gravRight: 260,
  gravityZeroPass: false,
  bulletMaxDistance: 500,        // ★ 預設改 500
  normalBulletSpeed: 240,
  normalBulletInterval: 2.4,
  sniperBulletSpeed: 520,
  sniperBulletInterval: 3.0,
  bombSpeed: 240,
  bombInterval: 7.0,
  bombFuse: 2.4,
  lightningSpeed: 82,
  lightningInterval: 11.0,
  musicVolume: 60,
  sfxVolume: 100
};

var CONFIG = {};
for (var k in DEFAULT_CONFIG) CONFIG[k] = DEFAULT_CONFIG[k];

try {
  var saved = localStorage.getItem('swapper_config_v2');
  if (saved) {
    var parsed = JSON.parse(saved);
    for (var k2 in parsed) {
      if (CONFIG.hasOwnProperty(k2)) CONFIG[k2] = parsed[k2];
    }
  }
} catch(e){}

function saveConfig(){
  try { localStorage.setItem('swapper_config_v2', JSON.stringify(CONFIG)); } catch(e){}
}

function hasAnyZeroGravity(){
  return CONFIG.gravTop === 0 || CONFIG.gravBottom === 0 ||
         CONFIG.gravLeft === 0 || CONFIG.gravRight === 0;
}

/* ===================== 基本環境 ===================== */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var cssW = 0, cssH = 0;
var viewOffsetX = 0, viewOffsetY = 0;

function tryFullscreen(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(function(){});
  }
  document.removeEventListener('touchstart', tryFullscreen);
  document.removeEventListener('click', tryFullscreen);
}
document.addEventListener('touchstart', tryFullscreen, { once: true });
document.addEventListener('click', tryFullscreen, { once: true });

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth || document.documentElement.clientWidth || 800;
  cssH = window.innerHeight || document.documentElement.clientHeight || 600;
  if (cssW < 1) cssW = 800;
  if (cssH < 1) cssH = 600;
  canvas.width  = Math.floor(cssW * DPR);
  canvas.height = Math.floor(cssH * DPR);
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var R = 20/9;
  var vr = cssW / cssH;
  if (vr > R){ H = cssH; W = cssH * R; }
  else { W = cssW; H = cssW / R; }
  viewOffsetX = (cssW - W) / 2;
  viewOffsetY = (cssH - H) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
resize();

/* ===================== 常數 ===================== */
var PLAYER_R        = 14;
var MAX_SPEED       = 1300;
var WALL_BOUNCE     = 0.98;
var OBS_MAX         = 14;
var OBS_MIN_R       = 14;
var OBS_MAX_R       = 26;
var OBS_DRAG        = 0.25;
var OBS_WALL        = 0.95;
var DANGER_R_NORMAL = 70;
var DANGER_R_BOMB   = 130;
var DANGER_EXIT     = 1.35;
var GRAZE_SCORE     = 180;
var BOMB_GRAZE_SCORE= 260;
var SWAP_KILL_SCORE = 220;
var MAX_HP          = 3;
var INVULN_HIT      = 1.6;
var INVULN_SWAP     = 0.4;
var ORB_R           = 5;
var ORB_LIFE        = 2.6;
var ORB_WALL        = 0.95;
var ORB_HIT_PAD     = 9;
var WARN_NORMAL     = 3.0;
var WARN_SNIPER     = 3.0;
var WARN_BOMB       = 1.6;
var SNIPER_AIM_SPD  = 2.1;
var STICK_MAX_R     = 82;
var STICK_MIN_MAG   = 0.15;
var BOUNCE_REST_PO  = 0.85;
var BOUNCE_REST_PB  = 0.85;
var BOUNCE_REST_OB  = 0.70;
var BOUNCE_FX_MIN   = 110;
var COMBO_WINDOW    = 3.0;
var TIME_SCORE_BASE = 8;
var TIME_SCORE_RAMP = 20;
var WARN_LIGHTNING  = 3.2;
var LIGHTNING_THICK = 10;
var LIGHTNING_DANGER= 90;
var LIGHTNING_GRAZE = 80;
var OBS_LIGHTNING_HP= 2.0;
var OBS_LIGHTNING_REGEN = 2.5;
var HEART_R         = 18;
var HEART_LIFE      = 15.0;
var BULLET_MAX_LIMIT = 5000;

/* ===================== 狀態 ===================== */
var state = 'ready';
var player = { x:0, y:0, vx:0, vy:0, r:PLAYER_R };
var obstacles = [];
var bullets = [];
var lightnings = [];
var swapOrbs = [];
var pending = [];
var particles = [];
var shocks = [];
var trails = [];
var swapEchoes = [];
var swapTrails = [];
var floats = [];
var hearts = [];

var heartSpawnTimer = CONFIG.heartSpawnInterval;
var elapsed = 0;
var score = 0;
var timeScore = 0;
var best = 0;
var hp = MAX_HP;
var invuln = 0;
var jumpCd = 0;
var shake = 0;
var flash = 0;
var dieTimer = 0;

var obsSpawnTimer = 1.5;
var bulletSpawnTimer = 2.4;
var bombSpawnTimer = 5.5;
var sniperSpawnTimer = 3.0;
var lightningSpawnTimer = 10.0;

var stickActive = false;
var stickPointerId = null;
var stickCx = 0, stickCy = 0;
var stickX = 0, stickY = 0;
var stickAngle = 0;
var stickMag = 0;

var grazeCombo = 0;
var grazeComboTimer = 0;
var dangerActive = false;

try { best = parseInt(localStorage.getItem('swapper13_best') || '0', 10) || 0; } catch(e){ best = 0; }

/* ===================== 音訊 ===================== */
var audioCtx = null;
var sfxGain = null;
var musicGain = null;

function initAudio(){
  if (audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC){
      audioCtx = new AC();
      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = CONFIG.sfxVolume / 100;
      sfxGain.connect(audioCtx.destination);
    }
  } catch(e){ audioCtx = null; }
}

function updateAudioVolumes(){
  if (sfxGain) sfxGain.gain.value = CONFIG.sfxVolume / 100;
  if (musicGain) musicGain.gain.value = CONFIG.musicVolume / 100;
}

function beep(freq, dur, type, vol){
  if (!audioCtx || !sfxGain) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime((vol || 0.07) * 1.8, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch(e){}
}
function sweep(f1, f2, dur, vol){
  if (!audioCtx || !sfxGain) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f1, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime((vol || 0.09) * 1.8, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
  } catch(e){}
}
function lightningSfx(){
  beep(160, 0.12, 'sawtooth', 0.05);
  setTimeout(function(){ beep(220, 0.09, 'sawtooth', 0.045); }, 55);
  setTimeout(function(){ beep(310, 0.07, 'sawtooth', 0.04); }, 110);
}
function heartPickupSfx(){
  beep(880, 0.08, 'sine', 0.09);
  setTimeout(function(){ beep(1170, 0.09, 'sine', 0.10); }, 60);
  setTimeout(function(){ beep(1560, 0.12, 'triangle', 0.09); }, 130);
}

/* ===================== 工具 ===================== */
function normalizeAngle(a){
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function roundRectPath(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r);
  c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h);
  c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r);
  c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}
function collideBodies(a, b, restitution){
  var dx = b.x - a.x, dy = b.y - a.y;
  var rSum = a.r + b.r;
  var d2 = dx*dx + dy*dy;
  if (d2 >= rSum*rSum || d2 < 0.0001) return 0;
  var d = Math.sqrt(d2);
  var nx = dx / d, ny = dy / d;
  var ma = a.r * a.r, mb = b.r * b.r;
  var totalM = ma + mb;
  var overlap = rSum - d;
  a.x -= nx * overlap * (mb / totalM);
  a.y -= ny * overlap * (mb / totalM);
  b.x += nx * overlap * (ma / totalM);
  b.y += ny * overlap * (ma / totalM);
  var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
  var vn = rvx * nx + rvy * ny;
  if (vn > 0) return 0;
  var j = -(1 + restitution) * vn / (1/ma + 1/mb);
  a.vx -= j * nx / ma; a.vy -= j * ny / ma;
  b.vx += j * nx / mb; b.vy += j * ny / mb;
  return Math.abs(j);
}

/* 邊界處理（玩家/障礙物/光球） */
function handleWall(obj, bounceFactor){
  var m = obj.r;
  var wrap = CONFIG.gravityZeroPass;
  if (obj.x < m){
    if (wrap && CONFIG.gravLeft === 0){ obj.x = W - m - 1; }
    else { obj.x = m; obj.vx = Math.abs(obj.vx) * bounceFactor; }
  }
  if (obj.x > W - m){
    if (wrap && CONFIG.gravRight === 0){ obj.x = m + 1; }
    else { obj.x = W - m; obj.vx = -Math.abs(obj.vx) * bounceFactor; }
  }
  if (obj.y < m){
    if (wrap && CONFIG.gravTop === 0){ obj.y = H - m - 1; }
    else { obj.y = m; obj.vy = Math.abs(obj.vy) * bounceFactor; }
  }
  if (obj.y > H - m){
    if (wrap && CONFIG.gravBottom === 0){ obj.y = m + 1; }
    else { obj.y = H - m; obj.vy = -Math.abs(obj.vy) * bounceFactor; }
  }
}

/* ===================== 重置 ===================== */
function reset(){
  player.x = W * 0.5;
  player.y = H * 0.5;
  player.vx = (Math.random() - 0.5) * 100;
  player.vy = 0;
  obstacles = [];
  bullets = [];
  lightnings = [];
  swapOrbs = [];
  pending = [];
  particles = [];
  shocks = [];
  trails = [];
  swapEchoes = [];
  swapTrails = [];
  floats = [];
  hearts = [];
  heartSpawnTimer = CONFIG.heartSpawnInterval;
  elapsed = 0;
  score = 0;
  timeScore = 0;
  hp = MAX_HP;
  invuln = 1.2;
  jumpCd = 0;
  shake = 0;
  flash = 0;
  dieTimer = 0;
  obsSpawnTimer = 1.2;
  bulletSpawnTimer = 2.4;
  bombSpawnTimer = 5.5;
  sniperSpawnTimer = 3.0;
  lightningSpawnTimer = 9.0;
  stickActive = false;
  stickPointerId = null;
  stickMag = 0;
  grazeCombo = 0;
  grazeComboTimer = 0;
  dangerActive = false;
  var initObs = Math.max(0, Math.floor(CONFIG.initialObstacles));
  for (var i=0;i<initObs;i++) spawnObstacle(true);
}

function difficulty(){ return Math.min(1, elapsed / 75); }

/* ===================== 四邊重力場 ===================== */
function gravityAt(x, y){
  var halfW = W * 0.5, halfH = H * 0.5;
  var lp = Math.max(0, 1 - x / halfW);
  var rp = Math.max(0, 1 - (W - x) / halfW);
  var tp = Math.max(0, 1 - y / halfH);
  var bp = Math.max(0, 1 - (H - y) / halfH);
  var fx = -CONFIG.gravLeft * lp * lp + CONFIG.gravRight * rp * rp;
  var fy = -CONFIG.gravTop * tp * tp + CONFIG.gravBottom * bp * bp;
  return { x: fx, y: fy };
}

/* ===================== 生成：障礙物 ===================== */
function spawnObstacle(inside){
  if (obstacles.length >= OBS_MAX) return;
  var side = Math.floor(Math.random() * 4);
  var m = 60;
  var x, y;
  if (side === 0){ x = Math.random()*W; y = -m; }
  else if (side === 1){ x = Math.random()*W; y = H+m; }
  else if (side === 2){ x = -m; y = Math.random()*H; }
  else { x = W+m; y = Math.random()*H; }
  if (inside){
    x = W * (0.15 + Math.random()*0.7);
    y = H * (0.15 + Math.random()*0.7);
  }
  var tx = W * (0.2 + Math.random()*0.6);
  var ty = H * (0.2 + Math.random()*0.6);
  var dx = tx - x, dy = ty - y;
  var len = Math.hypot(dx, dy) || 1;
  var sp = inside ? (30 + Math.random()*50) : (140 + Math.random()*140);
  var r = OBS_MIN_R + Math.random()*(OBS_MAX_R - OBS_MIN_R);
  obstacles.push({
    x: x, y: y,
    vx: (dx/len)*sp, vy: (dy/len)*sp,
    r: r,
    rot: Math.random()*Math.PI*2,
    rotV: (Math.random()-0.5)*3,
    hitGlow: 0, inside: false,
    lightningExposure: 0, lightningGlow: 0,
    swapTimer: 0
  });
}

/* ===================== 預警 ===================== */
function queueAttack(type){
  if (type === 'lightning'){
    var lside = Math.floor(Math.random()*4);
    var ix, iy;
    if (lside === 0){ ix = W*0.5; iy = 0; }
    else if (lside === 1){ ix = W*0.5; iy = H; }
    else if (lside === 2){ ix = 0; iy = H*0.5; }
    else { ix = W; iy = H*0.5; }
    pending.push({
      type: 'lightning', side: lside,
      iconX: ix, iconY: iy,
      timer: WARN_LIGHTNING, totalTime: WARN_LIGHTNING,
      aimAngle: 0
    });
    return;
  }
  var side = Math.floor(Math.random()*4);
  var margin = 70;
  var ix2, iy2;
  if (side === 0){ ix2 = margin + Math.random()*(W-margin*2); iy2 = 0; }
  else if (side === 1){ ix2 = margin + Math.random()*(W-margin*2); iy2 = H; }
  else if (side === 2){ ix2 = 0; iy2 = margin + Math.random()*(H-margin*2); }
  else { ix2 = W; iy2 = margin + Math.random()*(H-margin*2); }
  var totalTime = (type === 'bomb') ? WARN_BOMB : (type === 'sniper' ? WARN_SNIPER : WARN_NORMAL);
  var p = {
    type: type, side: side,
    iconX: ix2, iconY: iy2,
    timer: totalTime, totalTime: totalTime,
    aimAngle: 0
  };
  if (type === 'normal' || type === 'sniper'){
    p.aimAngle = Math.atan2(player.y - iy2, player.x - ix2);
  }
  pending.push(p);
}

/* ===================== 生成雷電 ===================== */
function spawnLightning(lside){
  var l = {
    type: 'lightning', side: lside,
    horizontal: (lside === 0 || lside === 1),
    pos: 0, vel: 0,
    thickness: LIGHTNING_THICK,
    dangerPhase: 'none',
    jitterSeed: Math.random()*1000,
    spawnTime: 0
  };
  if (lside === 0){ l.pos = -30; l.vel =  CONFIG.lightningSpeed; }
  if (lside === 1){ l.pos = H+30; l.vel = -CONFIG.lightningSpeed; }
  if (lside === 2){ l.pos = -30; l.vel =  CONFIG.lightningSpeed; }
  if (lside === 3){ l.pos = W+30; l.vel = -CONFIG.lightningSpeed; }
  lightnings.push(l);
  lightningSfx();
  shake = Math.min(18, shake + 8);
}

/* ===================== 發射 ===================== */
function fireBullet(x, y, angle, type){
  var speed, r;
  if (type === 'sniper'){ speed = CONFIG.sniperBulletSpeed + Math.random()*80 + difficulty()*80; r = 4; }
  else { speed = CONFIG.normalBulletSpeed + Math.random()*80 + difficulty()*60; r = 7; }
  var b = {
    type: type, x: x, y: y,
    vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    r: r, life: 12,
    inDanger: false, wasInDanger: false,
    hitPlayer: false, safe: false,
    traveled: 0,
    entered: false        // ★ 新增：是否已進入過畫面內部
  };
  var pd = Math.hypot(b.x - player.x, b.y - player.y);
  if (pd < 130) b.safe = true;
  bullets.push(b);
}
function fireBomb(x, y, side){
  var ang;
  if (side === 0) ang = Math.PI/2 + (Math.random()-0.5)*1.1;
  else if (side === 1) ang = -Math.PI/2 + (Math.random()-0.5)*1.1;
  else if (side === 2) ang = (Math.random()-0.5)*1.1;
  else ang = Math.PI + (Math.random()-0.5)*1.1;
  var speed = CONFIG.bombSpeed + Math.random()*80;
  var b = {
    type: 'bomb', x: x, y: y,
    vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
    r: 13, life: 14,
    fuse: CONFIG.bombFuse + Math.random()*0.5,
    bombGrav: 340,
    inDanger: false, wasInDanger: false,
    hitPlayer: false, safe: false,
    traveled: 0,
    entered: false
  };
  var pd = Math.hypot(b.x - player.x, b.y - player.y);
  if (pd < 150) b.safe = true;
  bullets.push(b);
}

/* ===================== 效果 ===================== */
function spawnBurst(x, y, color, n, mul){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var sp = (60 + Math.random()*300) * (mul || 1);
    particles.push({
      x:x, y:y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.35 + Math.random()*0.5, maxLife: 0.85,
      color: color, r: 1.5 + Math.random()*2.6
    });
  }
}
function spawnRing(x, y, color, maxR){
  shocks.push({ x:x, y:y, r:6, maxR: maxR || 80, life:0.5, maxLife:0.5, color: color });
}
function showFloat(x, y, text, color){
  floats.push({ x:x, y:y, text:text, color:color, life:1.1, maxLife:1.1 });
}

/* ===================== 受傷 ===================== */
function takeDamage(){
  hp--;
  invuln = INVULN_HIT;
  shake = Math.min(34, shake + 24);
  flash = 1;
  grazeCombo = 0;
  grazeComboTimer = 0;
  if (hp <= 0) die();
}

/* ===================== 交換光球被擊中 ===================== */
function applyOrbDamage(so){
  var ox = so.x, oy = so.y;
  spawnBurst(ox, oy, '255,80,100', 24, 1.5);
  spawnBurst(ox, oy, '94,200,255', 18, 1.3);
  spawnRing(ox, oy, '255,80,100', 90);
  spawnRing(ox, oy, '255,255,255', 55);
  if (invuln > 0) return;
  swapTrails.push({ x1:player.x, y1:player.y, x2:ox, y2:oy, life:0.48, maxLife:0.48, color:'255,80,100' });
  swapEchoes.push({ x:player.x, y:player.y, r:player.r, life:0.6, maxLife:0.6, color:'255,80,100' });
  swapEchoes.push({ x:ox, y:oy, r:player.r, life:0.6, maxLife:0.6, color:'255,80,100' });
  player.x = ox; player.y = oy;
  player.vx *= 0.3; player.vy *= 0.3;
  spawnRing(player.x, player.y, '255,80,80', 100);
  showFloat(player.x, player.y - 44, '光球被擊中！', '#ff6b8a');
  beep(120, 0.32, 'sawtooth', 0.16);
  setTimeout(function(){ beep(70, 0.35, 'sine', 0.12); }, 90);
  takeDamage();
}

/* ===================== 玩家動作 ===================== */
function doJump(){
  if (state !== 'playing') return;
  if (jumpCd > 0) return;
  jumpCd = CONFIG.jumpCooldown;
  var g = gravityAt(player.x, player.y);
  var gm = Math.hypot(g.x, g.y);
  var ux, uy;
  if (gm < 8){ ux = 0; uy = -1; }
  else { ux = -g.x / gm; uy = -g.y / gm; }
  player.vx += ux * CONFIG.jumpImpulse;
  player.vy += uy * CONFIG.jumpImpulse;
  for (var i=0;i<12;i++){
    var a = Math.atan2(uy, ux) + (Math.random()-0.5)*1.1;
    var sp = 100 + Math.random()*200;
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.4 + Math.random()*0.35, maxLife: 0.75,
      color: '94,241,255', r: 1.4 + Math.random()*2.2
    });
  }
  spawnRing(player.x, player.y, '94,241,255', 55);
  shake = Math.min(14, shake + 5);
  beep(720, 0.07, 'sine', 0.08);
}

function handleLeftAction(){
  if (state === 'ready' || state === 'dead'){
    if (state === 'dead' && dieTimer < 0.5) return;
    state = 'playing';
    reset();
    startMusic();
    return;
  }
  if (state !== 'playing') return;
  if (stickActive){
    stickActive = false;
    stickPointerId = null;
    stickMag = 0;
    beep(300, 0.06, 'sine', 0.05);
    return;
  }
  doJump();
}

function fireSwapOrb(angle){
  if (state !== 'playing') return;
  var playerSpeed = Math.hypot(player.vx, player.vy);
  var speed = CONFIG.orbSpeed + playerSpeed * 0.8;
  swapOrbs.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: ORB_R, life: ORB_LIFE,
    trail: []
  });
  spawnBurst(player.x, player.y, '94,200,255', 8, 0.9);
  spawnRing(player.x, player.y, '94,200,255', 42);
  beep(560, 0.06, 'triangle', 0.06);
  beep(900, 0.05, 'sine', 0.05);
}

function doSwapWith(o){
  if (state !== 'playing' || !o) return;
  var px = player.x, py = player.y;
  var pvx = player.vx, pvy = player.vy;
  var ox = o.x, oy = o.y;
  var ovx = o.vx, ovy = o.vy;
  swapTrails.push({ x1:px, y1:py, x2:ox, y2:oy, life:0.42, maxLife:0.42, color:'94,241,255' });
  swapEchoes.push({ x:px, y:py, r:player.r, life:0.55, maxLife:0.55, color:'94,241,255' });
  swapEchoes.push({ x:ox, y:oy, r:o.r,     life:0.55, maxLife:0.55, color:'255,160,90' });
  player.x = ox; player.y = oy;
  player.vx = ovx; player.vy = ovy;
  o.x = px; o.y = py;
  o.vx = pvx; o.vy = pvy;
  o.hitGlow = 0.7;
  o.swapTimer = 0.5;
  spawnBurst(px, py, '94,241,255', 18, 1.2);
  spawnBurst(ox, oy, '255,160,90', 18, 1.2);
  spawnRing(px, py, '94,241,255', 80);
  spawnRing(ox, oy, '255,160,90', 80);
  shake = Math.min(20, shake + 14);
  flash = Math.min(1, flash + 0.55);
  invuln = Math.max(invuln, INVULN_SWAP);
  sweep(420, 1300, 0.16, 0.11);
}

function breakObstacle(o){
  spawnBurst(o.x, o.y, '255,180,120', 18, 1.2);
  spawnBurst(o.x, o.y, '255,120,90', 12, 0.9);
  spawnRing(o.x, o.y, '255,180,120', 60);
  beep(280, 0.12, 'triangle', 0.08);
}

function checkSwapKillBonus(o){
  if (o.swapTimer > 0){
    var pts = Math.floor(SWAP_KILL_SCORE * Math.min(1 + grazeCombo * 0.5, 5));
    score += pts;
    grazeCombo++;
    grazeComboTimer = COMBO_WINDOW;
    showFloat(o.x, o.y - 30, '+' + pts + ' 交換擊破 x' + grazeCombo, '#ffd76b');
    beep(1200, 0.13, 'triangle', 0.11);
  }
}

/* ===================== 輸入 ===================== */
function getLocalXY(e){
  var rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left - viewOffsetX,
    y: e.clientY - rect.top  - viewOffsetY
  };
}
function onPointerDown(e){
  if (e && e.cancelable) e.preventDefault();
  initAudio();
  if (state === 'paused') return;
  if (state === 'ready' || state === 'dead'){
    if (state === 'dead' && dieTimer < 0.5) return;
    state = 'playing';
    reset();
    startMusic();
    return;
  }
  if (state !== 'playing') return;
  var p = getLocalXY(e);
  var cx = p.x, cy = p.y;
  if (cx < W * 0.5){
    handleLeftAction();
  } else {
    if (stickPointerId === null){
      stickPointerId = (e.pointerId !== undefined) ? e.pointerId : 1;
      stickActive = true;
      stickCx = cx; stickCy = cy;
      stickX = cx; stickY = cy;
      stickAngle = 0; stickMag = 0;
    }
  }
}
function onPointerMove(e){
  if (!stickActive || state !== 'playing') return;
  var pid = (e.pointerId !== undefined) ? e.pointerId : 1;
  if (pid !== stickPointerId) return;
  var p = getLocalXY(e);
  var cx = p.x, cy = p.y;
  var dx = cx - stickCx, dy = cy - stickCy;
  var d = Math.hypot(dx, dy);
  if (d > STICK_MAX_R){
    cx = stickCx + dx/d * STICK_MAX_R;
    cy = stickCy + dy/d * STICK_MAX_R;
    d = STICK_MAX_R;
  }
  stickX = cx; stickY = cy;
  if (d > 4) stickAngle = Math.atan2(dy, dx);
  stickMag = Math.min(1, d / STICK_MAX_R);
}
function onPointerUp(e){
  if (e && e.cancelable) e.preventDefault();
  var pid = (e.pointerId !== undefined) ? e.pointerId : 1;
  if (pid !== stickPointerId) return;
  stickPointerId = null;
  if (stickActive && stickMag > STICK_MIN_MAG) fireSwapOrb(stickAngle);
  stickActive = false; stickMag = 0;
}
function onPointerCancel(e){
  var pid = (e && e.pointerId !== undefined) ? e.pointerId : 1;
  if (pid === stickPointerId){
    stickPointerId = null; stickActive = false; stickMag = 0;
  }
}
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerCancel);
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    if (e.cancelable) e.preventDefault();
    if (e.repeat) return;
    if (state === 'paused') return;
    handleLeftAction();
  }
});

/* ===================== 更新 ===================== */
function update(rawDt){
  var dt = rawDt;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (state === 'paused') return;

  dangerActive = false;
  for (var i=0;i<bullets.length;i++){
    if (bullets[i].inDanger && !bullets[i].safe){ dangerActive = true; break; }
  }
  if (!dangerActive){
    for (i=0;i<lightnings.length;i++){
      if (lightnings[i].dangerPhase === 'inDanger'){ dangerActive = true; break; }
    }
  }
  var timeScale = 1;
  if (dangerActive) timeScale = 1/3;
  else if (stickActive) timeScale = 1/10;
  var sdt = dt * timeScale;
  var vdt = dt;
  if (shake > 0) shake = Math.max(0, shake - vdt*44);
  if (flash > 0) flash = Math.max(0, flash - vdt*3.2);
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life -= vdt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx * vdt; p.y += p.vy * vdt;
    var damp = 1 - vdt*3;
    p.vx *= damp; p.vy *= damp;
  }
  for (i=shocks.length-1;i>=0;i--){
    var s = shocks[i];
    s.life -= vdt;
    if (s.life <= 0){ shocks.splice(i,1); continue; }
    s.r = 6 + (s.maxR-6) * (1 - s.life/s.maxLife);
  }
  for (i=swapTrails.length-1;i>=0;i--){
    swapTrails[i].life -= vdt;
    if (swapTrails[i].life <= 0) swapTrails.splice(i,1);
  }
  for (i=swapEchoes.length-1;i>=0;i--){
    swapEchoes[i].life -= vdt;
    if (swapEchoes[i].life <= 0) swapEchoes.splice(i,1);
  }
  for (i=floats.length-1;i>=0;i--){
    var f = floats[i];
    f.life -= vdt; f.y -= vdt * 40;
    if (f.life <= 0) floats.splice(i,1);
  }
  for (i=trails.length-1;i>=0;i--){
    trails[i].life -= vdt;
    if (trails[i].life <= 0) trails.splice(i,1);
  }
  if (state === 'dead'){ dieTimer += vdt; return; }
  if (state !== 'playing') return;
  elapsed += sdt;
  var timeMul = 1 + elapsed / TIME_SCORE_RAMP;
  var gain = sdt * TIME_SCORE_BASE * timeMul;
  score += gain; timeScore += gain;
  if (invuln > 0) invuln -= sdt;
  if (jumpCd > 0) jumpCd -= sdt;
  if (grazeComboTimer > 0){
    grazeComboTimer -= sdt;
    if (grazeComboTimer <= 0) grazeCombo = 0;
  }
  // 玩家物理
  var g = gravityAt(player.x, player.y);
  player.vx += g.x * sdt;
  player.vy += g.y * sdt;
  var sp = Math.hypot(player.vx, player.vy);
  if (sp > MAX_SPEED){
    player.vx = player.vx / sp * MAX_SPEED;
    player.vy = player.vy / sp * MAX_SPEED;
  }
  player.x += player.vx * sdt;
  player.y += player.vy * sdt;
  handleWall(player, WALL_BOUNCE);
  trails.push({ x:player.x, y:player.y, life:0.3, maxLife:0.3 });
  if (trails.length > 26) trails.shift();

  // 愛心生成
  if (hp < MAX_HP && hearts.length < CONFIG.maxHearts){
    heartSpawnTimer -= sdt;
    if (heartSpawnTimer <= 0){
      var hx = 70 + Math.random() * (W - 140);
      var hy = 70 + Math.random() * (H - 140);
      hearts.push({ x: hx, y: hy, r: HEART_R, life: HEART_LIFE });
      heartSpawnTimer = CONFIG.heartSpawnInterval;
      spawnRing(hx, hy, '255,120,160', 50);
      beep(880, 0.12, 'sine', 0.06);
    }
  }
  for (i=hearts.length-1;i>=0;i--){
    var h = hearts[i];
    h.life -= sdt;
    if (h.life <= 0){ hearts.splice(i,1); continue; }
    var hdx = player.x - h.x, hdy = player.y - h.y;
    var hr = player.r + h.r;
    if (hdx*hdx + hdy*hdy < hr*hr){
      hp = Math.min(hp + 1, MAX_HP);
      spawnBurst(h.x, h.y, '255,120,160', 20, 1.3);
      spawnRing(h.x, h.y, '255,120,160', 90);
      showFloat(h.x, h.y - 30, '+1 HP', '#ff6b8a');
      heartPickupSfx();
      hearts.splice(i,1);
    }
  }
  // 預警更新
  for (i=pending.length-1;i>=0;i--){
    var pa = pending[i];
    pa.timer -= sdt;
    if (pa.type === 'sniper'){
      var tAngle = Math.atan2(player.y - pa.iconY, player.x - pa.iconX);
      var diff = normalizeAngle(tAngle - pa.aimAngle);
      var maxRot = SNIPER_AIM_SPD * sdt;
      if (Math.abs(diff) < maxRot) pa.aimAngle = tAngle;
      else pa.aimAngle += (diff > 0 ? 1 : -1) * maxRot;
    }
    if (pa.timer <= 0){
      if (pa.type === 'normal') fireBullet(pa.iconX, pa.iconY, pa.aimAngle, 'normal');
      else if (pa.type === 'sniper') fireBullet(pa.iconX, pa.iconY, pa.aimAngle, 'sniper');
      else if (pa.type === 'bomb') fireBomb(pa.iconX, pa.iconY, pa.side);
      else if (pa.type === 'lightning') spawnLightning(pa.side);
      pending.splice(i, 1);
    }
  }
  // 生成障礙物
  obsSpawnTimer -= sdt;
  if (obsSpawnTimer <= 0){
    spawnObstacle(false);
    obsSpawnTimer = Math.max(0.1, CONFIG.obstacleSpawnInterval) + Math.random()*0.5;
  }
  // 障礙物更新
  for (i=obstacles.length-1;i>=0;i--){
    var o = obstacles[i];
    var dr = Math.exp(-OBS_DRAG * sdt);
    o.vx *= dr; o.vy *= dr;
    o.x += o.vx * sdt; o.y += o.vy * sdt;
    o.rot += o.rotV * sdt;
    if (o.hitGlow > 0) o.hitGlow -= vdt * 1.6;
    if (o.swapTimer > 0) o.swapTimer -= sdt;
    if (o.lightningExposure > 0){
      o.lightningExposure -= OBS_LIGHTNING_REGEN * sdt;
      if (o.lightningExposure < 0) o.lightningExposure = 0;
    }
    if (o.lightningGlow > 0) o.lightningGlow -= vdt * 2.5;
    if (o.lightningGlow < 0) o.lightningGlow = 0;
    if (!o.inside && o.x > 0 && o.x < W && o.y > 0 && o.y < H) o.inside = true;
    if (o.inside) handleWall(o, OBS_WALL);
    if (o.x < -200 || o.x > W+200 || o.y < -200 || o.y > H+200){
      if (Math.hypot(o.vx, o.vy) > 20 && !o.inside){
        obstacles.splice(i,1); continue;
      }
    }
  }
  // 生成攻擊
  bulletSpawnTimer -= sdt;
  if (bulletSpawnTimer <= 0){
    queueAttack('normal');
    bulletSpawnTimer = Math.max(0.1, CONFIG.normalBulletInterval) + Math.random()*0.5;
  }
  sniperSpawnTimer -= sdt;
  if (sniperSpawnTimer <= 0){
    queueAttack('sniper');
    sniperSpawnTimer = Math.max(0.1, CONFIG.sniperBulletInterval) + Math.random()*0.5;
  }
  bombSpawnTimer -= sdt;
  if (bombSpawnTimer <= 0){
    queueAttack('bomb');
    bombSpawnTimer = Math.max(0.5, CONFIG.bombInterval) + Math.random()*1.0;
  }
  lightningSpawnTimer -= sdt;
  if (lightningSpawnTimer <= 0){
    queueAttack('lightning');
    lightningSpawnTimer = Math.max(1.0, CONFIG.lightningInterval) + Math.random()*2.0;
  }
  // 雷電更新
  for (i=lightnings.length-1;i>=0;i--){
    var lt = lightnings[i];
    lt.pos += lt.vel * sdt;
    lt.spawnTime += sdt;
    var out = false;
    if (lt.horizontal){ if (lt.pos < -100 || lt.pos > H + 100) out = true; }
    else { if (lt.pos < -100 || lt.pos > W + 100) out = true; }
    if (out){ lightnings.splice(i, 1); continue; }
    if (Math.random() < 0.7){
      var sparkX, sparkY;
      if (lt.horizontal){ sparkX = Math.random()*W; sparkY = lt.pos + (Math.random()-0.5)*lt.thickness*3; }
      else { sparkX = lt.pos + (Math.random()-0.5)*lt.thickness*3; sparkY = Math.random()*H; }
      particles.push({
        x: sparkX, y: sparkY,
        vx: (Math.random()-0.5)*120, vy: (Math.random()-0.5)*120,
        life: 0.25 + Math.random()*0.35, maxLife: 0.6,
        color: '200,130,255', r: 1 + Math.random()*1.8
      });
    }
    var distToPlayer;
    if (lt.horizontal) distToPlayer = Math.abs(player.y - lt.pos);
    else distToPlayer = Math.abs(player.x - lt.pos);
    var hitRange = player.r + lt.thickness * 0.5 + 4;
    if (distToPlayer < hitRange && invuln <= 0){
      spawnBurst(player.x, player.y, '190,110,255', 30, 1.6);
      spawnRing(player.x, player.y, '190,110,255', 110);
      shake = Math.min(36, shake + 26); flash = 1;
      beep(90, 0.42, 'sawtooth', 0.18);
      lt.dangerPhase = 'none';
      takeDamage();
      if (state !== 'playing') return;
    }
    if (distToPlayer < LIGHTNING_DANGER){
      if (lt.dangerPhase !== 'inDanger') lt.dangerPhase = 'inDanger';
    } else if (lt.dangerPhase === 'inDanger' && distToPlayer > LIGHTNING_DANGER * 1.4){
      if (invuln <= 0){
        var lPts = LIGHTNING_GRAZE * Math.min(1 + grazeCombo * 0.4, 4);
        score += Math.floor(lPts); grazeCombo++;
        grazeComboTimer = COMBO_WINDOW;
        showFloat(player.x, player.y - 42, '+' + Math.floor(lPts) + ' 雷電 x' + grazeCombo, '#c07bff');
        beep(1050, 0.12, 'triangle', 0.08);
      }
      lt.dangerPhase = 'none';
    }
    for (var oi2 = obstacles.length-1; oi2 >= 0; oi2--){
      var oo3 = obstacles[oi2];
      var distToObs;
      if (lt.horizontal) distToObs = Math.abs(oo3.y - lt.pos);
      else distToObs = Math.abs(oo3.x - lt.pos);
      if (distToObs < oo3.r + lt.thickness * 0.5){
        oo3.lightningExposure += sdt;
        oo3.lightningGlow = 1;
        if (oo3.lightningExposure >= OBS_LIGHTNING_HP){
          checkSwapKillBonus(oo3);
          spawnBurst(oo3.x, oo3.y, '200,130,255', 22, 1.4);
          spawnRing(oo3.x, oo3.y, '200,130,255', 80);
          breakObstacle(oo3);
          obstacles.splice(oi2, 1);
        }
      }
    }
  }
  // 交換光球更新
  for (i=swapOrbs.length-1;i>=0;i--){
    var so = swapOrbs[i];
    so.x += so.vx * sdt; so.y += so.vy * sdt;
    so.life -= sdt;
    handleWall(so, ORB_WALL);
    so.trail.push({ x:so.x, y:so.y, life:0.25, maxLife:0.25 });
    if (so.trail.length > 16) so.trail.shift();
    for (var ti=so.trail.length-1;ti>=0;ti--){
      so.trail[ti].life -= vdt;
      if (so.trail[ti].life <= 0) so.trail.splice(ti,1);
    }
    if (so.life <= 0){ swapOrbs.splice(i, 1); continue; }
    if (CONFIG.orbCanEatHearts){
      for (var hi=hearts.length-1;hi>=0;hi--){
        var hh = hearts[hi];
        var odx = so.x - hh.x, ody = so.y - hh.y;
        var orr = so.r + hh.r;
        if (odx*odx + ody*ody < orr*orr){
          hp = Math.min(hp + 1, MAX_HP);
          spawnBurst(hh.x, hh.y, '255,120,160', 20, 1.3);
          spawnRing(hh.x, hh.y, '255,120,160', 90);
          showFloat(hh.x, hh.y - 30, '+1 HP', '#ff6b8a');
          heartPickupSfx();
          hearts.splice(hi,1);
          break;
        }
      }
    }
    var orbHitByBullet = false;
    for (var bi=bullets.length-1;bi>=0;bi--){
      var bu = bullets[bi];
      if (bu.type === 'bomb') continue;
      var dxb = so.x - bu.x, dyb = so.y - bu.y;
      var rrb = so.r + bu.r + ORB_HIT_PAD;
      if (dxb*dxb + dyb*dyb < rrb*rrb){
        spawnBurst(bu.x, bu.y, '255,220,160', 10, 1.0);
        bullets.splice(bi, 1);
        orbHitByBullet = true;
        break;
      }
    }
    if (orbHitByBullet){
      applyOrbDamage(so);
      swapOrbs.splice(i, 1);
      if (state !== 'playing') return;
      continue;
    }
    var hitO = null;
    for (var j=0;j<obstacles.length;j++){
      var oo = obstacles[j];
      var dxo = so.x - oo.x, dyo = so.y - oo.y;
      var rro = so.r + oo.r;
      if (dxo*dxo + dyo*dyo < rro*rro){ hitO = oo; break; }
    }
    if (hitO){
      spawnBurst(so.x, so.y, '94,200,255', 14, 1.2);
      doSwapWith(hitO);
      swapOrbs.splice(i, 1);
      if (state !== 'playing') return;
      continue;
    }
    var hitB = false;
    for (var k=0;k<bullets.length;k++){
      var bb = bullets[k];
      if (bb.type !== 'bomb') continue;
      var dxb2 = so.x - bb.x, dyb2 = so.y - bb.y;
      var rrb2 = so.r + bb.r;
      if (dxb2*dxb2 + dyb2*dyb2 < rrb2*rrb2){
        bb.fuse = 0;
        spawnBurst(so.x, so.y, '255,200,120', 12, 1.2);
        hitB = true;
        break;
      }
    }
    if (hitB){ swapOrbs.splice(i, 1); continue; }
  }
  // 物理碰撞
  if (invuln <= 0){
    for (i=0;i<obstacles.length;i++){
      var ob = obstacles[i];
      if (!ob.inside) continue;
      var impP = collideBodies(player, ob, BOUNCE_REST_PO);
      if (impP > BOUNCE_FX_MIN){
        spawnBurst((player.x+ob.x)*0.5, (player.y+ob.y)*0.5, '220,230,255', 6, 0.7);
        shake = Math.min(14, shake + 4);
      }
    }
  }
  for (i=bullets.length-1;i>=0;i--){
    var bmb = bullets[i];
    if (bmb.type !== 'bomb') continue;
    if (invuln > 0) continue;
    var impB = collideBodies(player, bmb, BOUNCE_REST_PB);
    if (impB > BOUNCE_FX_MIN){
      spawnBurst((player.x+bmb.x)*0.5, (player.y+bmb.y)*0.5, '255,200,140', 7, 0.7);
      shake = Math.min(14, shake + 4);
    }
  }
  for (i=0;i<obstacles.length;i++){
    var oA = obstacles[i];
    if (!oA.inside) continue;
    for (var kk=0;kk<bullets.length;kk++){
      var bA = bullets[kk];
      if (bA.type !== 'bomb') continue;
      collideBodies(oA, bA, BOUNCE_REST_OB);
    }
  }
  // ========== 子彈更新 ==========
  for (i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    if (b.type === 'bomb'){
      b.vy += b.bombGrav * sdt;
      b.x += b.vx * sdt; b.y += b.vy * sdt;
      b.fuse -= sdt;
      b.traveled += Math.hypot(b.vx, b.vy) * sdt;

      // 標記 entered：炸彈完全進入畫面內部才視為已進入
      if (!b.entered){
        if (b.x > b.r && b.x < W - b.r && b.y > b.r && b.y < H - b.r){
          b.entered = true;
        }
      }

      // 穿透模式：只有 entered 後才處理邊界
      if (CONFIG.gravityZeroPass){
        if (b.entered){
          var bm = b.r;
          if (b.x < bm && CONFIG.gravLeft === 0){ b.x = W - bm - 1; }
          else if (b.x < bm){ b.x = bm; b.vx = Math.abs(b.vx)*0.72; }
          if (b.x > W-bm && CONFIG.gravRight === 0){ b.x = bm + 1; }
          else if (b.x > W-bm){ b.x = W-bm; b.vx = -Math.abs(b.vx)*0.72; }
          if (b.y < bm && CONFIG.gravTop === 0){ b.y = H - bm - 1; }
          else if (b.y < bm){ b.y = bm; b.vy = Math.abs(b.vy)*0.72; }
          if (b.y > H-bm && CONFIG.gravBottom === 0){ b.y = bm + 1; }
          else if (b.y > H-bm){ b.y = H-bm; b.vy = -Math.abs(b.vy)*0.72; }
        }
      } else {
        if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx)*0.72; }
        if (b.x > W-b.r){ b.x = W-b.r; b.vx = -Math.abs(b.vx)*0.72; }
        if (b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy)*0.72; }
        if (b.y > H-b.r){ b.y = H-b.r; b.vy = -Math.abs(b.vy)*0.72; }
      }

      // 行徑距離上限（只在穿透模式且距離有限時）
      if (CONFIG.gravityZeroPass && CONFIG.bulletMaxDistance < BULLET_MAX_LIMIT
          && b.traveled > CONFIG.bulletMaxDistance){
        spawnBurst(b.x, b.y, '255,200,150', 8, 0.6);
        bullets.splice(i, 1);
        continue;
      }
      var bd = Math.hypot(b.x - player.x, b.y - player.y);
      if (!b.safe){
        if (bd < DANGER_R_BOMB){ b.inDanger = true; b.wasInDanger = true; }
        else if (bd > DANGER_R_BOMB * DANGER_EXIT && b.inDanger){ b.inDanger = false; }
      }
      if (b.fuse <= 0){
        var ex = b.x, ey = b.y;
        var explodeR = 88;
        spawnBurst(ex, ey, '255,180,90', 28, 1.6);
        spawnBurst(ex, ey, '255,90,60', 20, 1.3);
        spawnRing(ex, ey, '255,200,120', 110);
        shake = Math.min(26, shake + 16);
        flash = Math.min(1, flash + 0.35);
        beep(90, 0.35, 'sawtooth', 0.14);
        for (var oi=swapOrbs.length-1; oi>=0; oi--){
          var orb = swapOrbs[oi];
          var od = Math.hypot(orb.x - ex, orb.y - ey);
          if (od < explodeR + orb.r){
            applyOrbDamage(orb);
            swapOrbs.splice(oi, 1);
            if (state !== 'playing') return;
          }
        }
        if (!b.safe && invuln <= 0){
          var dd = Math.hypot(player.x - ex, player.y - ey);
          if (dd < explodeR + player.r){
            b.hitPlayer = true;
            spawnRing(player.x, player.y, '255,80,80', 90);
            beep(120, 0.3, 'sawtooth', 0.15);
            takeDamage();
            if (state !== 'playing') return;
          }
        }
        if (b.wasInDanger && !b.hitPlayer && !b.safe){
          var bombPts = BOMB_GRAZE_SCORE * Math.min(1 + grazeCombo * 0.5, 5);
          score += Math.floor(bombPts); grazeCombo++;
          grazeComboTimer = COMBO_WINDOW;
          showFloat(ex, ey - 30, '+' + Math.floor(bombPts) + ' 驚險 x' + grazeCombo, '#ffd76b');
          beep(1200, 0.14, 'triangle', 0.09);
        }
        bullets.splice(i, 1);
        continue;
      }
      continue;
    }
    b.x += b.vx * sdt; b.y += b.vy * sdt;
    b.life -= sdt;
    b.traveled += Math.hypot(b.vx, b.vy) * sdt;

    // ★ 標記 entered：一般子彈完全進入畫面內部才視為已進入
    if (!b.entered){
      if (b.x > b.r && b.x < W - b.r && b.y > b.r && b.y < H - b.r){
        b.entered = true;
      }
    }

    // ★ 邊界處理
    if (CONFIG.gravityZeroPass){
      // 穿透模式：只有 entered 後才判定邊界，避免剛射出就被判撞牆
      if (b.entered){
        var bm2 = b.r;
        if (b.x < bm2 && CONFIG.gravLeft === 0){ b.x = W - bm2 - 1; }
        else if (b.x < bm2){ b.x = bm2; b.vx = Math.abs(b.vx); b.life = Math.min(b.life, 0.001); }
        if (b.x > W-bm2 && CONFIG.gravRight === 0){ b.x = bm2 + 1; }
        else if (b.x > W-bm2){ b.x = W-bm2; b.vx = -Math.abs(b.vx); b.life = Math.min(b.life, 0.001); }
        if (b.y < bm2 && CONFIG.gravTop === 0){ b.y = H - bm2 - 1; }
        else if (b.y < bm2){ b.y = bm2; b.vy = Math.abs(b.vy); b.life = Math.min(b.life, 0.001); }
        if (b.y > H-bm2 && CONFIG.gravBottom === 0){ b.y = bm2 + 1; }
        else if (b.y > H-bm2){ b.y = H-bm2; b.vy = -Math.abs(b.vy); b.life = Math.min(b.life, 0.001); }
      }
    } else {
      // 非穿透模式：飛出 -140 到 W+140 範圍後消失
      if (b.x < -140 || b.x > W+140 || b.y < -140 || b.y > H+140){
        if (b.wasInDanger && b.inDanger && !b.hitPlayer && !b.safe){
          var outPts = GRAZE_SCORE * Math.min(1 + grazeCombo * 0.5, 5);
          score += Math.floor(outPts); grazeCombo++;
          grazeComboTimer = COMBO_WINDOW;
        }
        bullets.splice(i,1); continue;
      }
    }

    // 行徑距離上限
    if (CONFIG.gravityZeroPass && CONFIG.bulletMaxDistance < BULLET_MAX_LIMIT
        && b.traveled > CONFIG.bulletMaxDistance){
      spawnBurst(b.x, b.y, '220,220,240', 8, 0.7);
      bullets.splice(i, 1);
      continue;
    }
    if (b.life <= 0){ bullets.splice(i,1); continue; }

    var nd = Math.hypot(b.x - player.x, b.y - player.y);
    if (!b.safe){
      if (nd < DANGER_R_NORMAL){ b.inDanger = true; b.wasInDanger = true; }
      else if (nd > DANGER_R_NORMAL * DANGER_EXIT && b.inDanger){
        if (!b.hitPlayer && !b.safe){
          var pts = GRAZE_SCORE * Math.min(1 + grazeCombo * 0.5, 5);
          score += Math.floor(pts); grazeCombo++;
          grazeComboTimer = COMBO_WINDOW;
          showFloat(player.x, player.y - 42, '+' + Math.floor(pts) + ' 擦身 x' + grazeCombo, '#ffd76b');
          beep(1150, 0.12, 'triangle', 0.09);
        }
        b.inDanger = false;
      }
    }
    var hitObstacle = false;
    for (var jj=obstacles.length-1;jj>=0;jj--){
      var oo2 = obstacles[jj];
      var dxo2 = b.x - oo2.x, dyo2 = b.y - oo2.y;
      var rro2 = b.r + oo2.r;
      if (dxo2*dxo2 + dyo2*dyo2 < rro2*rro2){
        checkSwapKillBonus(oo2);
        breakObstacle(oo2);
        obstacles.splice(jj, 1);
        hitObstacle = true;
        break;
      }
    }
    if (hitObstacle){ bullets.splice(i, 1); continue; }
    if (!b.safe && invuln <= 0){
      var pdx = b.x - player.x, pdy = b.y - player.y;
      var prr = b.r + player.r;
      if (pdx*pdx + pdy*pdy < prr*prr){
        b.hitPlayer = true;
        spawnBurst(b.x, b.y, '255,90,90', 20, 1.2);
        spawnRing(player.x, player.y, '255,90,90', 70);
        beep(130, 0.28, 'sawtooth', 0.14);
        bullets.splice(i, 1);
        takeDamage();
        if (state !== 'playing') return;
        continue;
      }
    }
  }
}

function die(){
  state = 'dead';
  dieTimer = 0;
  shake = 30; flash = 1;
  spawnBurst(player.x, player.y, '94,241,255', 46, 1.6);
  spawnBurst(player.x, player.y, '255,215,107', 22, 1.4);
  spawnRing(player.x, player.y, '94,241,255', 170);
  var fs = Math.floor(score);
  if (fs > best){
    best = fs;
    try { localStorage.setItem('swapper13_best', String(best)); } catch(e){}
  }
  beep(90, 0.5, 'sawtooth', 0.16);
  setTimeout(function(){ beep(60, 0.6, 'sine', 0.12); }, 100);
  stopMusic();
}

/* ===================== 繪製 ===================== */
function drawGravField(){
  var halfW = W*0.5, halfH = H*0.5;
  var lp = Math.max(0, 1 - player.x / halfW);
  var rp = Math.max(0, 1 - (W - player.x) / halfW);
  var tp = Math.max(0, 1 - player.y / halfH);
  var bp = Math.max(0, 1 - (H - player.y) / halfH);
  var thickness = 26;
  if (lp > 0.02 && CONFIG.gravLeft > 0){
    var lg = ctx.createLinearGradient(0,0,thickness,0);
    lg.addColorStop(0, 'rgba(255,180,120,' + (lp*0.42) + ')');
    lg.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = lg; ctx.fillRect(0,0,thickness,H);
  }
  if (rp > 0.02 && CONFIG.gravRight > 0){
    var rg = ctx.createLinearGradient(W,0,W-thickness,0);
    rg.addColorStop(0, 'rgba(255,180,120,' + (rp*0.42) + ')');
    rg.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = rg; ctx.fillRect(W-thickness,0,thickness,H);
  }
  if (tp > 0.02 && CONFIG.gravTop > 0){
    var tg = ctx.createLinearGradient(0,0,0,thickness);
    tg.addColorStop(0, 'rgba(255,180,120,' + (tp*0.42) + ')');
    tg.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = tg; ctx.fillRect(0,0,W,thickness);
  }
  if (bp > 0.02 && CONFIG.gravBottom > 0){
    var bg2 = ctx.createLinearGradient(0,H,0,H-thickness);
    bg2.addColorStop(0, 'rgba(255,180,120,' + (bp*0.42) + ')');
    bg2.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = bg2; ctx.fillRect(0,H-thickness,W,thickness);
  }
}

function drawScopeIcon(x, y, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.strokeStyle = 'rgba(255,60,90,0.98)';
  ctx.fillStyle = 'rgba(255,60,90,0.98)';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255,60,90,0.98)';
  ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-24, 0); ctx.lineTo(-9, 0);
  ctx.moveTo(9, 0); ctx.lineTo(24, 0);
  ctx.moveTo(0, -24); ctx.lineTo(0, -9);
  ctx.moveTo(0, 9); ctx.lineTo(0, 24);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawExclamIcon(x, y, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,200,80,0.98)';
  ctx.shadowColor = 'rgba(255,200,80,0.98)';
  ctx.shadowBlur = 18;
  roundRectPath(ctx, -3, -18, 6, 22, 3); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 10, 4.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLightningIcon(x, y, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.strokeStyle = 'rgba(200,120,255,0.98)';
  ctx.fillStyle = 'rgba(200,120,255,0.98)';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(200,120,255,0.98)';
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.moveTo(6, -22); ctx.lineTo(-10, 2); ctx.lineTo(-1, 2);
  ctx.lineTo(-6, 22); ctx.lineTo(10, -4); ctx.lineTo(1, -4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPending(p){
  if (p.type === 'lightning'){
    var liAlpha;
    if (p.timer < 0.4) liAlpha = 1;
    else {
      var liFreq = 3 + (p.totalTime - p.timer) * 4;
      liAlpha = 0.65 + 0.35 * Math.sin(p.timer * liFreq * Math.PI * 2);
      if (liAlpha < 0.35) liAlpha = 0.35;
    }
    if (p.side === 0 || p.side === 1){
      var sy = p.side === 0 ? 0 : H;
      ctx.save();
      ctx.globalAlpha = 0.20 * liAlpha;
      ctx.strokeStyle = 'rgba(200,120,255,1)';
      ctx.lineWidth = 3; ctx.setLineDash([10, 12]);
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
      ctx.restore();
    } else {
      var sx = p.side === 2 ? 0 : W;
      ctx.save();
      ctx.globalAlpha = 0.20 * liAlpha;
      ctx.strokeStyle = 'rgba(200,120,255,1)';
      ctx.lineWidth = 3; ctx.setLineDash([10, 12]);
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = liAlpha;
    var lpct = 1 - p.timer / p.totalTime;
    ctx.strokeStyle = 'rgba(200,120,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.iconX, p.iconY, 26 + (1-lpct)*10, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    drawLightningIcon(p.iconX, p.iconY, liAlpha);
    return;
  }
  if (p.type === 'bomb'){
    var bpct = 1 - p.timer / p.totalTime;
    drawExclamIcon(p.iconX, p.iconY, 0.95);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,200,80,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.iconX, p.iconY, 26 + (1-bpct)*8, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    return;
  }
  var alpha;
  if (p.timer < 0.4) alpha = 1;
  else {
    var freq = 3 + (p.totalTime - p.timer) * 4;
    alpha = 0.6 + 0.4 * Math.sin(p.timer * freq * Math.PI * 2);
    if (alpha < 0.3) alpha = 0.3;
  }
  var ex = p.iconX + Math.cos(p.aimAngle) * 2600;
  var ey = p.iconY + Math.sin(p.aimAngle) * 2600;
  if (p.type === 'sniper'){
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,40,60,0.98)';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = 'rgba(255,40,60,0.98)';
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(p.iconX, p.iconY); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
    var ddx = player.x - p.iconX, ddy = player.y - p.iconY;
    var distP = Math.hypot(ddx, ddy);
    var angP = Math.atan2(ddy, ddx);
    var diffA = Math.abs(normalizeAngle(angP - p.aimAngle));
    if (diffA < 0.08 && distP > 0){
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4*Math.sin(performance.now()/60);
      ctx.strokeStyle = 'rgba(255,40,60,1)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'rgba(255,40,60,1)';
      ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 16, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  } else {
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.strokeStyle = 'rgba(255,140,160,0.9)';
    ctx.lineWidth = 1.4; ctx.setLineDash([6, 10]);
    ctx.beginPath(); ctx.moveTo(p.iconX, p.iconY); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
  }
  drawScopeIcon(p.iconX, p.iconY, alpha);
}

function drawLightning(lt){
  var now = performance.now();
  var dangerGlow = (lt.dangerPhase === 'inDanger') ? 1 : 0;
  ctx.save();
  ctx.shadowColor = 'rgba(180,80,255,0.9)';
  ctx.shadowBlur = 40 + dangerGlow * 20;
  ctx.strokeStyle = 'rgba(180,80,255,0.55)';
  ctx.lineWidth = lt.thickness * 3.2;
  ctx.lineCap = 'round';
  if (lt.horizontal){ ctx.beginPath(); ctx.moveTo(0, lt.pos); ctx.lineTo(W, lt.pos); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(lt.pos, 0); ctx.lineTo(lt.pos, H); ctx.stroke(); }
  ctx.shadowBlur = 22;
  ctx.strokeStyle = 'rgba(200,120,255,1)';
  ctx.lineWidth = lt.thickness;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var segs = 22;
  if (lt.horizontal){
    ctx.beginPath();
    for (var i = 0; i <= segs; i++){
      var sx = i * (W / segs);
      var off = Math.sin(now/90 + i*0.9 + lt.jitterSeed) * 3.5 + (Math.random() - 0.5) * 2.5;
      var sy = lt.pos + off;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  } else {
    ctx.beginPath();
    for (var k = 0; k <= segs; k++){
      var sy2 = k * (H / segs);
      var off2 = Math.sin(now/90 + k*0.9 + lt.jitterSeed) * 3.5 + (Math.random() - 0.5) * 2.5;
      var sx2 = lt.pos + off2;
      if (k === 0) ctx.moveTo(sx2, sy2); else ctx.lineTo(sx2, sy2);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = lt.thickness * 0.35;
  if (lt.horizontal){
    ctx.beginPath();
    for (var j = 0; j <= segs; j++){
      var wx = j * (W / segs);
      var woff = Math.sin(now/90 + j*0.9 + lt.jitterSeed) * 3.5;
      var wy = lt.pos + woff;
      if (j === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  } else {
    ctx.beginPath();
    for (var n = 0; n <= segs; n++){
      var wy2 = n * (H / segs);
      var woff2 = Math.sin(now/90 + n*0.9 + lt.jitterSeed) * 3.5;
      var wx2 = lt.pos + woff2;
      if (n === 0) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
    }
    ctx.stroke();
  }
  ctx.restore();
  if (dangerGlow > 0){
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = 'rgba(200,120,255,1)';
    if (lt.horizontal) ctx.fillRect(0, lt.pos - LIGHTNING_DANGER, W, LIGHTNING_DANGER*2);
    else ctx.fillRect(lt.pos - LIGHTNING_DANGER, 0, LIGHTNING_DANGER*2, H);
    ctx.restore();
  }
}

function drawStick(){
  if (!stickActive) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(stickCx, stickCy, STICK_MAX_R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,215,107,0.025)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,107,0.16)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(stickCx, stickCy, 4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,215,107,0.22)'; ctx.fill();
  ctx.beginPath(); ctx.arc(stickX, stickY, 18, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,215,107,0.10)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,107,0.32)'; ctx.lineWidth = 2; ctx.stroke();
  if (stickMag > STICK_MIN_MAG){
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = 'rgba(255,90,120,0.65)';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(255,90,120,0.7)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(stickAngle)*800, player.y + Math.sin(stickAngle)*800);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawHeartShape(c, x, y, s){
  c.beginPath();
  c.moveTo(x, y + s * 0.4);
  c.bezierCurveTo(x, y, x - s, y - s * 0.3, x - s, y + s * 0.2);
  c.bezierCurveTo(x - s, y + s * 0.9, x, y + s * 1.1, x, y + s * 1.6);
  c.bezierCurveTo(x, y + s * 1.1, x + s, y + s * 0.9, x + s, y + s * 0.2);
  c.bezierCurveTo(x + s, y - s * 0.3, x, y, x, y + s * 0.4);
  c.closePath();
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cssW, cssH);
  ctx.save();
  ctx.translate(viewOffsetX, viewOffsetY);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c0a24');
  bg.addColorStop(0.5, '#080620');
  bg.addColorStop(1, '#100a26');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  drawGravField();
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  var i, o, b, p, s, l, f, t, so, pa, lt;
  for (i=0;i<swapTrails.length;i++){
    l = swapTrails[i];
    var la = l.life / l.maxLife;
    var lc = l.color || '255,255,255';
    ctx.save();
    ctx.globalAlpha = la * 0.9;
    ctx.strokeStyle = 'rgba(' + lc + ',1)';
    ctx.lineWidth = 6 * la + 2;
    ctx.shadowColor = 'rgba(' + lc + ',1)';
    ctx.shadowBlur = 28; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<swapEchoes.length;i++){
    var ec = swapEchoes[i];
    var ea = ec.life / ec.maxLife;
    ctx.save();
    ctx.globalAlpha = ea * 0.7;
    ctx.strokeStyle = 'rgba(' + ec.color + ',1)';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(' + ec.color + ',1)';
    ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(ec.x, ec.y, ec.r * (1 + (1-ea)*1.6), 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<shocks.length;i++){
    s = shocks[i];
    var sa = s.life / s.maxLife;
    ctx.save();
    ctx.globalAlpha = sa * 0.85;
    ctx.strokeStyle = 'rgba(' + s.color + ',1)';
    ctx.lineWidth = 3 * sa + 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<obstacles.length;i++){
    o = obstacles[i];
    var glow = o.hitGlow > 0 ? o.hitGlow : 0;
    var lGlow = o.lightningGlow > 0 ? o.lightningGlow : 0;
    var swapGlow = o.swapTimer > 0 ? Math.min(1, o.swapTimer / 0.5) : 0;
    ctx.save();
    if (lGlow > 0.1){
      ctx.shadowColor = 'rgba(200,120,255,' + (0.6 + lGlow*0.35) + ')';
      ctx.shadowBlur = 20 + lGlow*24;
    } else if (swapGlow > 0.1){
      ctx.shadowColor = 'rgba(255,215,107,' + (0.6 + swapGlow*0.4) + ')';
      ctx.shadowBlur = 22 + swapGlow*20;
    } else {
      ctx.shadowColor = 'rgba(255,170,90,' + (0.55 + glow*0.4) + ')';
      ctx.shadowBlur = 16 + glow*20;
    }
    var og = ctx.createRadialGradient(o.x - o.r*0.3, o.y - o.r*0.3, 0, o.x, o.y, o.r);
    if (lGlow > 0.3){
      og.addColorStop(0, '#f3e0ff'); og.addColorStop(1, '#a04de8');
    } else if (swapGlow > 0.1){
      og.addColorStop(0, '#fff5c8'); og.addColorStop(1, '#ffb84d');
    } else {
      og.addColorStop(0, glow > 0.3 ? '#fff0c8' : '#ffc98a');
      og.addColorStop(1, glow > 0.3 ? '#ff8844' : '#d9772e');
    }
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.translate(o.x, o.y); ctx.rotate(o.rot);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + glow*0.4 + lGlow*0.4 + swapGlow*0.3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, o.r * 0.55, 0, Math.PI * 1.3); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<trails.length;i++){
    t = trails[i];
    var ta = t.life / t.maxLife;
    ctx.globalAlpha = ta * 0.4;
    ctx.fillStyle = '#5ef1ff';
    ctx.beginPath(); ctx.arc(t.x, t.y, player.r * (0.3 + ta * 0.7), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (i=0;i<lightnings.length;i++) drawLightning(lightnings[i]);
  for (i=0;i<hearts.length;i++){
    var h = hearts[i];
    var hpPulse = 0.75 + 0.25 * Math.sin(performance.now()/220);
    var lifeRatio = Math.max(0, h.life / HEART_LIFE);
    ctx.save();
    var hglow = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r * 3.2);
    hglow.addColorStop(0, 'rgba(255,120,160,' + (0.55 * hpPulse) + ')');
    hglow.addColorStop(0.5, 'rgba(255,80,120,' + (0.2 * hpPulse) + ')');
    hglow.addColorStop(1, 'rgba(255,80,120,0)');
    ctx.fillStyle = hglow;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 3.2, 0, Math.PI*2); ctx.fill();
    ctx.translate(h.x, h.y); ctx.scale(hpPulse, hpPulse);
    ctx.shadowColor = 'rgba(255,80,120,0.95)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#c81e45';
    drawHeartShape(ctx, 0, 0, h.r * 0.95); ctx.fill();
    ctx.shadowBlur = 0;
    var hg = ctx.createRadialGradient(-h.r*0.35, -h.r*0.35, 0, 0, 0, h.r * 0.95);
    hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.35, '#ff8fa8'); hg.addColorStop(1, '#e0254f');
    ctx.fillStyle = hg;
    drawHeartShape(ctx, 0, 0, h.r * 0.95); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(-h.r*0.35, -h.r*0.25, h.r*0.22, h.r*0.13, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = 'rgba(255,180,200,0.8)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 8, -Math.PI/2, -Math.PI/2 + Math.PI*2 * lifeRatio); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<swapOrbs.length;i++){
    so = swapOrbs[i];
    for (var ti=0;ti<so.trail.length;ti++){
      var tt = so.trail[ti];
      var tta = tt.life / tt.maxLife;
      ctx.globalAlpha = tta * 0.55;
      ctx.fillStyle = '#5ecbff';
      ctx.beginPath(); ctx.arc(tt.x, tt.y, so.r * (0.4 + tta*0.9), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.shadowColor = 'rgba(94,200,255,1)';
    ctx.shadowBlur = 24;
    var sog = ctx.createRadialGradient(so.x, so.y, 0, so.x, so.y, so.r*1.8);
    sog.addColorStop(0, '#ffffff'); sog.addColorStop(0.4, '#5ecbff'); sog.addColorStop(1, 'rgba(30,120,220,0)');
    ctx.fillStyle = sog;
    ctx.beginPath(); ctx.arc(so.x, so.y, so.r*1.8, 0, Math.PI*2); ctx.fill();
    var pulse = 0.5 + 0.5*Math.sin(performance.now()/180);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + pulse*0.35) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(so.x, so.y, so.r + 4 + pulse*1.5, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  for (i=0;i<bullets.length;i++){
    b = bullets[i];
    if (b.type === 'bomb'){
      var fuseRatio = b.fuse / CONFIG.bombFuse;
      var col = fuseRatio < 0.35 ? '255,120,60' : '255,180,90';
      ctx.save();
      ctx.shadowColor = 'rgba(' + col + ',0.95)';
      ctx.shadowBlur = 20;
      var bgg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r*1.6);
      bgg.addColorStop(0, 'rgba(255,255,200,0.9)');
      bgg.addColorStop(0.5, 'rgba(' + col + ',0.8)');
      bgg.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = bgg;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(' + col + ',1)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      var pct = Math.max(0, Math.min(1, b.fuse / CONFIG.bombFuse));
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct); ctx.stroke();
      ctx.restore();
      continue;
    }
    var isSniper = (b.type === 'sniper');
    var ang = Math.atan2(b.vy, b.vx);
    var scaleX = isSniper ? 3.2 : 2.1;
    var scaleY = isSniper ? 1.0 : 1.1;
    ctx.save();
    var tailLen = isSniper ? 40 : 22;
    var tx = b.x - Math.cos(ang) * tailLen;
    var ty = b.y - Math.sin(ang) * tailLen;
    var tg = ctx.createLinearGradient(b.x, b.y, tx, ty);
    tg.addColorStop(0, 'rgba(230,235,245,0.9)');
    tg.addColorStop(1, 'rgba(200,215,235,0)');
    ctx.strokeStyle = tg;
    ctx.lineWidth = b.r * 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(ang); ctx.scale(scaleX, scaleY);
    ctx.shadowColor = 'rgba(235,240,250,1)';
    ctx.shadowBlur = isSniper ? 26 : 18;
    var sg = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, 0, 0, 0, b.r);
    sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.6, '#dfe6f2'); sg.addColorStop(1, '#9aa8c0');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.9; ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.35, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if (state !== 'dead'){
    var blink = (invuln > 0 && state === 'playing' && Math.floor(invuln*20)%2===0);
    if (!blink){
      ctx.save();
      var pg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r*2.4);
      pg.addColorStop(0, 'rgba(255,255,255,0.9)');
      pg.addColorStop(0.35, 'rgba(94,241,255,0.7)');
      pg.addColorStop(1, 'rgba(30,120,200,0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r*2.4, 0, Math.PI*2); ctx.fill();
      ctx.shadowColor = 'rgba(94,241,255,0.95)';
      ctx.shadowBlur = 26;
      var cg = ctx.createRadialGradient(player.x - player.r*0.3, player.y - player.r*0.3, 0, player.x, player.y, player.r);
      cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.6, '#7ef3ff'); cg.addColorStop(1, '#28a8d8');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      if (jumpCd > 0){
        var jp = 1 - jumpCd / Math.max(0.01, CONFIG.jumpCooldown);
        ctx.strokeStyle = 'rgba(255,215,107,0.8)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 5, -Math.PI/2, -Math.PI/2 + Math.PI*2*jp); ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(255,215,107,' + (0.28 + Math.sin(performance.now()/400)*0.2) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 5, 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }
  }
  for (i=0;i<particles.length;i++){
    p = particles[i];
    var pa2 = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = pa2;
    ctx.fillStyle = 'rgba(' + p.color + ',1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*pa2 + 0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (i=0;i<floats.length;i++){
    f = floats[i];
    var fa = f.life / f.maxLife;
    ctx.save();
    ctx.globalAlpha = fa;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 20px sans-serif';
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 14;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
  for (i=0;i<pending.length;i++) drawPending(pending[i]);
  ctx.restore();
  drawStick();
  if (dangerActive && state === 'playing'){
    ctx.save();
    ctx.strokeStyle = 'rgba(200,120,255,' + (0.35 + Math.sin(performance.now()/120)*0.18) + ')';
    ctx.lineWidth = 4; ctx.strokeRect(2, 2, W-4, H-4);
    ctx.restore();
  } else if (stickActive && state === 'playing'){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,215,107,' + (0.14 + Math.sin(performance.now()/220)*0.08) + ')';
    ctx.lineWidth = 2; ctx.strokeRect(2, 2, W-4, H-4);
    ctx.restore();
  }
  if (flash > 0.01){
    ctx.fillStyle = 'rgba(200,235,255,' + (flash*0.18) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  ctx.restore();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.strokeStyle = 'rgba(60,80,120,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(viewOffsetX-0.5, viewOffsetY-0.5, W+1, H+1);
}

function drawHeart(x, y, s){
  drawHeartShape(ctx, x, y, s); ctx.fill();
}

function drawHUD(){
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '700 44px sans-serif';
  ctx.fillStyle = '#eaf6ff';
  ctx.shadowColor = 'rgba(94,241,255,0.7)';
  ctx.shadowBlur = 16;
  ctx.fillText(String(Math.floor(score)), 22, 18);
  ctx.shadowBlur = 0;
  ctx.font = '600 12px sans-serif';
  ctx.fillStyle = 'rgba(180,215,255,0.65)';
  ctx.fillText('BEST  ' + best, 24, 70);

  ctx.fillStyle = 'rgba(140,220,180,0.85)';

    ctx.textAlign = 'left';

      ctx.textAlign = 'center';
      ctx.font = '700 14px sans-serif';

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'ready'){

    ctx.fillStyle = '#eaf6ff';
    ctx.shadowColor = 'rgba(94,241,255,0.85)';
    ctx.shadowBlur = 26;
    ctx.fillText('意 念 之 間', W/2, H*0.10);
    ctx.shadowBlur = 0;
    ctx.font = '600 13px sans-serif';
    ctx.fillStyle = 'rgba(94,241,255,0.95)';

    ctx.fillStyle = 'rgba(255,215,107,0.95)';
    ctx.fillText('按住右半拖曳搖桿 → 放開發射藍色交換光球', W/2, H*0.10 + 62);
    ctx.fillStyle = 'rgba(255,140,165,0.9)';
    ctx.fillText('瞄準中點左半或按空白鍵可取消', W/2, H*0.10 + 84);
